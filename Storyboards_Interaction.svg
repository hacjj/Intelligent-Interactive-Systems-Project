  <g transform="translate(288, 272)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#dcfce7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#166534">2. ZERO CONFIRMATION FATIGUE</text>
    <rect x="20" y="42" width="202" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" />
    <text x="121" y="60" font-size="10" font-weight="800" fill="#166534" text-anchor="middle">Router: c ≥ 0.80 (High Tier)</text>
    <text x="121" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Commits 19.0°C Immediately</text>
    <text x="121" y="110" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Single chime + brief confirm</text>
    <text x="121" y="128" font-size="9" fill="#166534" text-anchor="middle">No redundant 4.0s hold delay</text>
  </g>
  <path d="M 531 347 L 545 347" stroke="#64748b" stroke-width="2" />
  <polygon points="551,347 543,342 543,352" fill="#64748b" />

