  <g transform="translate(816, 62)" filter="url(#card-sh)">
    <rect width="240" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
    <rect width="240" height="24" rx="8" fill="#dcfce7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#166534">4. WAKE-WORD-FREE PATCH</text>
    <rect x="20" y="36" width="200" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" />
    <text x="120" y="57" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle">Driver: "No, fourteen"</text>
    <text x="120" y="92" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Patched: 40 → 14 Oak Road</text>
    <text x="120" y="111" font-size="9.5" font-weight="700" fill="#16a34a" text-anchor="middle">NAV Updated: ETA 9 min</text>
    <text x="120" y="131" font-size="9" font-weight="600" fill="#475569" text-anchor="middle">Hands stayed on steering wheel</text>
  </g>

  <!-- ================= STORYBOARD 2 ================= -->
  <rect x="24" y="232" width="1032" height="30" rx="6" fill="#0f172a" />
  <text x="38" y="252" font-size="12" font-weight="800" fill="#ffffff">STORYBOARD 2: QUIET CRUISE (c = 0.93) DIRECT EXECUTION &amp; PASSENGER CHATTER GUARD</text>

  <!-- Frame 2.1 -->
  <g transform="translate(24, 272)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#e0f2fe" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#0369a1">1. LOW-RISK CLIMATE COMMAND</text>
    <rect x="20" y="42" width="202" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="121" y="60" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">"Set cabin temperature</text>
    <text x="121" y="75" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">to 19 degrees"</text>
    <text x="121" y="112" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">45 mph clear cruise (54 dB)</text>
    <text x="121" y="130" font-size="9.5" font-weight="700" fill="#16a34a" text-anchor="middle">Effective Confidence: c = 0.93</text>
  </g>
  <path d="M 267 347 L 281 347" stroke="#64748b" stroke-width="2" />
  <polygon points="287,347 279,342 279,352" fill="#64748b" />

