  <g transform="translate(552, 482)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#fef3c7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#92400e">3. EYE-LINE HUD + THUMB PILLS</text>
    <rect x="16" y="34" width="210" height="66" rx="6" fill="#0f172a" />
    <text x="121" y="50" font-size="8.8" font-weight="700" fill="#f8fafc" text-anchor="middle">"Daughter Payal, or Dr. Patel?"</text>
    <rect x="24" y="58" width="92" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <text x="70" y="77" font-size="9.5" font-weight="800" fill="#78350f" text-anchor="middle">[←] Payal</text>
    <rect x="126" y="58" width="92" height="32" rx="5" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5" />
    <text x="172" y="77" font-size="9.5" font-weight="800" fill="#083344" text-anchor="middle">[→] Dr. Patel</text>
    <text x="121" y="118" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Peripheral windshield HUD</text>
    <text x="121" y="134" font-size="9" fill="#475569" text-anchor="middle">Accessible for noisy / HoH drivers</text>
  </g>
  <path d="M 795 557 L 809 557" stroke="#64748b" stroke-width="2" />
  <polygon points="815,557 807,552 807,562" fill="#64748b" />

  <!-- Frame 3.4 -->
  <g transform="translate(816, 482)" filter="url(#card-sh)">
    <rect width="240" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
    <rect width="240" height="24" rx="8" fill="#dcfce7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#166534">4. MULTIMODAL RESOLUTION</text>
    <rect x="20" y="38" width="200" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" />
    <text x="120" y="55" font-size="9" font-weight="800" fill="#166534" text-anchor="middle">Says "Actually Dr. Patel"</text>
    <text x="120" y="70" font-size="8.8" fill="#0f172a" text-anchor="middle">OR clicks [→] steering thumb switch</text>
    <text x="120" y="104" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Connected: Dr. Patel</text>
    <text x="120" y="124" font-size="9.5" font-weight="700" fill="#16a34a" text-anchor="middle">Safe eyes-forward call placed</text>
  </g>
</svg>
