<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="card-sh" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="1064" height="674" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- ================= STORYBOARD 1 ================= -->
  <rect x="24" y="22" width="1032" height="30" rx="6" fill="#0f172a" />
  <text x="38" y="42" font-size="12" font-weight="800" fill="#ffffff">STORYBOARD 1: HIGHWAY RAIN REROUTE (c = 0.61) — PROSODIC READBACK &amp; EYES-ON-ROAD REPAIR</text>

  <!-- Frame 1.1 -->
  <g transform="translate(24, 62)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#e0f2fe" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#0369a1">1. DRIVER PTT COMMAND</text>
    <circle cx="46" cy="68" r="18" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
    <text x="46" y="72" font-size="9.5" font-weight="800" fill="#0369a1" text-anchor="middle">DRIVER</text>
    <rect x="74" y="44" width="154" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="151" y="62" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">"Navigate to</text>
    <text x="151" y="77" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">fourteen Oak Road"</text>
    <text x="121" y="114" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Eyes on 65 mph wet road</text>
    <text x="121" y="132" font-size="9.5" fill="#dc2626" text-anchor="middle">+ Rain &amp; tyre noise (72 dB)</text>
  </g>
  <path d="M 267 137 L 281 137" stroke="#64748b" stroke-width="2" />
  <polygon points="287,137 279,132 279,142" fill="#64748b" />

  <!-- Frame 1.2 -->
  <g transform="translate(288, 62)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#fef3c7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#92400e">2. RISK-CALIBRATED ROUTER</text>
    <rect x="18" y="38" width="206" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" />
    <text x="121" y="56" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">ASR 1-Best: "40 Oak Road"</text>
    <text x="121" y="73" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Effective c = 0.61 (Risk -0.04)</text>
    <text x="121" y="106" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Router: 0.45 ≤ c &lt; 0.80</text>
    <text x="121" y="125" font-size="9.5" font-weight="700" fill="#d97706" text-anchor="middle">Holds reroute → Opens 4s gate</text>
  </g>
  <path d="M 531 137 L 545 137" stroke="#64748b" stroke-width="2" />
  <polygon points="551,137 543,132 543,142" fill="#64748b" />

  <!-- Frame 1.3 -->
  <g transform="translate(552, 62)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#fef3c7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#92400e">3. PROSODIC TTS + EYE-LINE HUD</text>
