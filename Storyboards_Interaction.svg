    <text x="121" y="53" font-size="9.5" font-weight="700" fill="#fbbf24" text-anchor="middle">TTS: "Route to 40 Oak</text>
    <text x="121" y="68" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">Road?" (Rising intonation)</text>
    <rect x="26" y="76" width="88" height="14" rx="3" fill="#fef3c7" />
    <text x="70" y="86" font-size="8" font-weight="800" fill="#78350f" text-anchor="middle">40 Oak Rd</text>
    <rect x="126" y="76" width="88" height="14" rx="3" fill="#cffafe" />
    <text x="170" y="86" font-size="8" font-weight="800" fill="#083344" text-anchor="middle">14 Oak Rd</text>
    <text x="121" y="114" font-size="9.5" font-weight="800" fill="#dc2626" text-anchor="middle">4.0s HUD Progress Ring Open</text>
    <text x="121" y="131" font-size="9" fill="#475569" text-anchor="middle">(Zero downward console glance)</text>
  </g>
  <path d="M 795 137 L 809 137" stroke="#64748b" stroke-width="2" />
  <polygon points="815,137 807,132 807,142" fill="#64748b" />

