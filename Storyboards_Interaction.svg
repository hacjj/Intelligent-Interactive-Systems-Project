    <rect x="20" y="42" width="202" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="121" y="60" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Driver: "Call Dr. Patel"</text>
    <text x="121" y="75" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">ASR: "Call Daughter Payal"</text>
    <text x="121" y="110" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">75 mph crosswind (78 dB)</text>
    <text x="121" y="128" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">Risk-adj c = 0.36 (&lt; 0.45)</text>
  </g>
  <path d="M 267 557 L 281 557" stroke="#64748b" stroke-width="2" />
  <polygon points="287,557 279,552 279,562" fill="#64748b" />

