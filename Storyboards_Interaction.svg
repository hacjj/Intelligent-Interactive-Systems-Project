    <text x="121" y="60" font-size="9.5" font-weight="700" fill="#92400e" text-anchor="middle">During an Open 4.0s HUD Gate:</text>
    <text x="121" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">"Stopping for coffee soon?"</text>
    <text x="121" y="110" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Passenger speech enters mic</text>
    <text x="121" y="128" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Evaluated by Domain Guard</text>
  </g>
  <path d="M 795 347 L 809 347" stroke="#64748b" stroke-width="2" />
  <polygon points="815,347 807,342 807,352" fill="#64748b" />

  <!-- Frame 2.4 -->
  <g transform="translate(816, 272)" filter="url(#card-sh)">
    <rect width="240" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8" />
    <rect width="240" height="24" rx="8" fill="#dcfce7" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#166534">4. CHATTER SAFELY REJECTED</text>
    <rect x="20" y="42" width="200" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" />
    <text x="120" y="60" font-size="9" font-weight="800" fill="#166534" text-anchor="middle">IGNORED_PASSENGER_CHATTER</text>
    <text x="120" y="76" font-size="9" font-weight="600" fill="#0f172a" text-anchor="middle">No repair marker or slot token</text>
    <text x="120" y="110" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">4.0s ring continues safely</text>
    <text x="120" y="128" font-size="9" fill="#166534" text-anchor="middle">Prevents false route/call hijack</text>
  </g>

  <!-- ================= STORYBOARD 3 ================= -->
  <rect x="24" y="442" width="1032" height="30" rx="6" fill="#0f172a" />
  <text x="38" y="462" font-size="12" font-weight="800" fill="#ffffff">STORYBOARD 3: CROSSWIND OUTBOUND CALL (c = 0.36) — HIGH-RISK HOLD &amp; THUMB-SWITCH FALLBACK</text>

  <!-- Frame 3.1 -->
  <g transform="translate(24, 482)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#e0f2fe" />
