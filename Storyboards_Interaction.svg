    <rect width="242" height="24" rx="8" fill="#fee2e2" />
    <text x="12" y="16" font-size="10" font-weight="800" fill="#991b1b">2. OUTBOUND DIALING HELD</text>
    <rect x="20" y="42" width="202" height="44" rx="6" fill="#fef2f2" stroke="#ef4444" />
    <text x="121" y="60" font-size="10" font-weight="800" fill="#991b1b" text-anchor="middle">State: CLARIFYING</text>
    <text x="121" y="76" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Auto-dialing blocked</text>
    <text x="121" y="110" font-size="9.5" font-weight="600" fill="#475569" text-anchor="middle">Prevents awkward unintended</text>
    <text x="121" y="128" font-size="9.5" font-weight="700" fill="#991b1b" text-anchor="middle">outbound call while driving</text>
  </g>
  <path d="M 531 557 L 545 557" stroke="#64748b" stroke-width="2" />
  <polygon points="551,557 543,552 543,562" fill="#64748b" />

