  <g transform="translate(552, 272)" filter="url(#card-sh)">
    <rect width="242" height="150" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" />
    <rect width="242" height="24" rx="8" fill="#fef3c7" />
